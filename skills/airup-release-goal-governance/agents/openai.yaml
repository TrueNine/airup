interface:
  display_name: "Release Goal Governance"
  short_description: "维护 milestone、release、图表与 skill 的发布治理一致性:目标与非目标先行,发布以命令与 exit code 证据开闸,失败复盘闭环落盘到 issue、模板或 skill,而非留在对话记录。创建、执行或关闭 milestone 与 release 时使用。"
  default_prompt: "使用 $airup-release-goal-governance 管理 milestone 与 release 的目标、发布证据与复盘闭环。"
