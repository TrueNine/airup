interface:
  display_name: "Ddd Event Storming Design"
  short_description: "用 Event Storming 与需求追踪进行 DDD 建模:从原始需求出发,以行为优先澄清 Domain Event、Command、Policy、Aggregate 与 Read Model,并审查由数据库表、CRUD 页面或包结构驱动的伪 DDD 设计。适用于看似 CRUD 的后台需求与持续演进的业务域。"
  default_prompt: "使用 $airup-ddd-event-storming-design 澄清业务需求,识别参与者、Command、Domain Event、Policy、Aggregate 与 Read Model,产出可追踪且行为优先的 DDD 设计。"

policy:
  allow_implicit_invocation: true
