interface:
  display_name: "Dev Bdd"
  short_description: "把业务需求成文为 Gherkin `.feature` 行为契约:稳定 `@req-<id>` 需求 ID、三方对齐、可执行验收;新需求先于实现固定行为,配合 airup-dev-tdd 的 RED-GREEN 切片。适用于需求对齐、验收标准定义与业务行为回归保护。"
  default_prompt: "使用 $airup-dev-bdd 把新需求先行成文为 Gherkin .feature 行为契约,用稳定 @req-<id> 与三方对齐固定验收标准,再交由 $airup-dev-tdd 以 RED-GREEN 切片实现。"

policy:
  allow_implicit_invocation: true
