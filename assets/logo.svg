<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Airup</title>
  <desc>A symmetrical blue fighter-ace insignia. Five tightly joined feathers form each straight-edged wing, framing a bold A and the parallel ascending chevron behind it. The A and wings share a baseline. Transparent background.</desc>
  <defs>
    <linearGradient id="blue" x1="256" y1="106" x2="256" y2="343" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CB9FF"/>
      <stop offset="1" stop-color="#2859DA"/>
    </linearGradient>
    <path id="a" d="M256 196 314 343H271.864L262 318H250L240.136 343H198ZM256 251 245.741 277H266.259Z" fill-rule="evenodd"/>
    <path id="wing-outline" d="M249 220 32 173 137 330 203 343Z"/>
    <clipPath id="wing-clip">
      <use href="#wing-outline"/>
    </clipPath>
    <g id="left-wing">
      <use href="#wing-outline" fill="url(#blue)"/>
      <path d="M32 200 240 245.051M32 227 231 270.101M32 254 222 295.152M32 281 213 320.203" stroke="#101E3C" stroke-width="6" clip-path="url(#wing-clip)"/>
      <use href="#wing-outline" stroke="#101E3C" stroke-width="8" stroke-linejoin="miter"/>
    </g>
  </defs>
  <g transform="translate(0 35)">
    <path d="M256 106 300.98 220H271.285L256 181.26 240.715 220H211.02Z" fill="url(#blue)" stroke="#101E3C" stroke-width="8" stroke-linejoin="miter"/>
    <use href="#left-wing"/>
    <use href="#left-wing" transform="translate(512 0) scale(-1 1)"/>
    <use href="#a" fill="url(#blue)" stroke="#101E3C" stroke-width="8" stroke-linejoin="miter"/>
  </g>
</svg>
